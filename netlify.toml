# Sitio estático: no hay paso de compilación, Netlify publica la carpeta "sitio" tal cual.
[build]
  publish = "sitio"
  command = ""

# Las fotos y el logo casi no cambian: el navegador los guarda 30 días.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
